<svg width="1200" height="350" viewBox="0 0 1200 350"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C6FF">
        <animate attributeName="stop-color"
                 values="#00C6FF;#7B2FF7;#00C6FF"
                 dur="5s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#7B2FF7">
        <animate attributeName="stop-color"
                 values="#7B2FF7;#00C6FF;#7B2FF7"
                 dur="5s"
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="typing1">
      <rect x="0" y="0" width="0" height="50">
        <animate
          attributeName="width"
          values="0;620;620;0"
          dur="6s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>

  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bg)"/>

  <!-- Animated circles -->

  <circle cx="100" cy="80" r="3" fill="#00C6FF">
    <animate attributeName="cy"
             values="80;40;80"
             dur="4s"
             repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values="0.2;1;0.2"
             dur="4s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="1080" cy="100" r="4" fill="#7B2FF7">
    <animate attributeName="cy"
             values="100;50;100"
             dur="5s"
             repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values="0.2;1;0.2"
             dur="5s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="950" cy="280" r="3" fill="#00C6FF">
    <animate attributeName="cy"
             values="280;230;280"
             dur="4s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="200" cy="280" r="4" fill="#7B2FF7">
    <animate attributeName="cy"
             values="280;230;280"
             dur="6s"
             repeatCount="indefinite"/>
  </circle>

  <!-- Decorative lines -->

  <path d="M0 290 Q300 230 600 290 T1200 290"
        fill="none"
        stroke="#00C6FF"
        stroke-width="2"
        opacity="0.35">

    <animate attributeName="d"
             values="
             M0 290 Q300 230 600 290 T1200 290;
             M0 290 Q300 330 600 290 T1200 290;
             M0 290 Q300 230 600 290 T1200 290"
             dur="6s"
             repeatCount="indefinite"/>

  </path>

  <!-- Main Name -->

  <text x="600"
        y="125"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="700"
        fill="url(#textGradient)"
        filter="url(#glow)">
    Ravi Navadeep
  </text>

  <!-- Subtitle -->

  <text x="600"
        y="175"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        fill="#FFFFFF"
        opacity="0.9">

    Computer Science &amp; Artificial Intelligence

  </text>

  <!-- Animated role -->

  <g clip-path="url(#typing1)">

    <text x="600"
          y="225"
          text-anchor="middle"
          font-family="monospace"
          font-size="21"
          fill="#00C6FF">

      &gt; Aspiring AI Engineer

    </text>

  </g>

  <!-- Bottom badge -->

  <rect x="445"
        y="255"
        width="310"
        height="45"
        rx="22"
        fill="#0D1117"
        stroke="#00C6FF"
        stroke-width="1.5"
        opacity="0.9"/>

  <text x="600"
        y="284"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        fill="#FFFFFF">

    Learn • Build • Innovate 🚀

  </text>

</svg>
